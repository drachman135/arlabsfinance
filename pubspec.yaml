name: arlabs_finance_client
description: "ArLABS Finance Client - Client/Debitur Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.4.0

  # Network
  dio: ^5.11.0

  # Database (Cross-platform: Android + Web)
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Supabase
  supabase_flutter: ^2.17.1

  # Secure Storage
  flutter_secure_storage: ^11.0.0

  # Local Notifications
  flutter_local_notifications: ^22.2.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilities
  logger: ^2.7.0
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
